[project]
name = "ilias-mcp"
version = "0.1.0"
description = "A local, read-only ILIAS MCP server."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "tzdata>=2025.1,<2027",
]

[project.scripts]
ilias-mcp = "ilias_mcp.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ilias_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
